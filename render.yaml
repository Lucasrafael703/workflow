databases:
  - name: lps-db
    plan: free
    databaseName: lps
    user: lps

services:
  - type: web
    name: lps-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: lps-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.7

# check_overdue_tasks fica de fora por enquanto: o Render nao tem plano free
# para Cron Jobs (o mais barato, 0.5c-512mb, e' cobrado por segundo de
# execucao). Ate decidir pagar por isso, rode manualmente pelo Shell do
# servico web: `python manage.py check_overdue_tasks`.
