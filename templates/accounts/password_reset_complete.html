{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha redefinida — LPS</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-page">
{% include "_icons.html" %}

<div class="auth">
    <aside class="auth__brand">
        <div class="auth__brand-inner">
            <div class="auth__eyebrow">LPS</div>
            <h1 class="auth__headline">Tudo pronto,<br><span>pode entrar.</span></h1>
            <p class="auth__lead">Sua senha foi redefinida com sucesso.</p>
        </div>
        <img class="auth__symbol" src="{% static 'img/logo-lps-symbol.png' %}" alt="">
    </aside>

    <main class="auth__panel">
        <div class="auth__card">
            <a href="{% url 'login' %}" class="auth__logo">
                <img src="{% static 'img/logo-lps-full.png' %}" alt="LPS — O amigo do gestor.">
            </a>

            <h2 class="auth__title">Senha redefinida</h2>
            <p class="auth__subtitle">Sua senha foi alterada com sucesso. Já pode entrar na sua conta.</p>

            <a href="{% url 'login' %}" class="auth__submit" style="text-decoration:none; display:inline-flex;">
                Ir para o login
            </a>
        </div>
    </main>
</div>
</body>
</html>
