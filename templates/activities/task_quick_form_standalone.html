{% extends "base.html" %}
{% block title %}Nova tarefa — LPS{% endblock %}

{% block content %}
<div class="modal-backdrop">
    <div class="modal">
        <div class="modal__head">
            <div>
                <h2>Nova tarefa</h2>
                <div class="sub">Toda tarefa pertence a uma atividade — escolha uma existente ou crie uma nova.</div>
            </div>
            <a href="{% url 'task-list' %}" class="modal__close" title="Fechar sem salvar" aria-label="Fechar sem salvar">&times;</a>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="modal__body">
                {% include "activities/_task_editor_fields.html" %}
            </div>
            <div class="modal__foot">
                <a href="{% url 'task-list' %}" class="btn">Cancelar</a>
                <button type="submit" class="btn btn--primary">Adicionar tarefa</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
