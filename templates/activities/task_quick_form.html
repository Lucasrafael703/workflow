{% extends "base.html" %}
{% block title %}Nova tarefa — LPS{% endblock %}

{% block content %}
<div class="modal-backdrop">
    <div class="modal">
        <div class="modal__head">
            <div>
                <h2>Nova tarefa</h2>
                <div class="sub">Atividade: {{ activity.title }}</div>
            </div>
            <a href="{% url 'activity-detail' activity.pk %}" class="modal__close" title="Fechar sem salvar" aria-label="Fechar sem salvar">&times;</a>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="modal__body">
                {% include "activities/_task_quick_fields.html" %}
            </div>
            <div class="modal__foot">
                <a href="{% url 'activity-detail' activity.pk %}" class="btn">Cancelar</a>
                <button type="submit" class="btn btn--primary">Adicionar tarefa</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
