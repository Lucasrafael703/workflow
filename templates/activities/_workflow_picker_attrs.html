{% comment %}Atributos de um botão que abre o seletor de Etapa ou de Status (static/js/workflow-picker.js).
Uma linha só, porque entra dentro da tag: <button {% include "activities/_workflow_picker_attrs.html" with kind="stage" %}>.
Espera: item (demanda ou tarefa), kind ("stage" | "condition"), kanban_domain ("demandas" | "tarefas"), can_manage (opcional).{% endcomment %}data-workflow-picker data-kind="{{ kind }}" data-domain="{{ kanban_domain }}" data-item-id="{{ item.pk }}" data-sector-id="{{ item.sector_id }}" data-options-url="{% if kind == 'stage' %}{% url 'sector-stage-options' item.sector_id %}{% else %}{% url 'sector-condition-options' item.sector_id %}{% endif %}?dominio={% if kanban_domain == 'demandas' %}demanda{% else %}tarefa{% endif %}" data-set-url="{% if kind == 'stage' %}{% url 'kanban-set-stage' kanban_domain item.pk %}{% else %}{% url 'kanban-set-condition' kanban_domain item.pk %}{% endif %}" data-current-id="{% if kind == 'stage' %}{{ item.stage_id|default:'' }}{% else %}{{ item.condition_id|default:'' }}{% endif %}" data-create-url="{% url 'kanban-create-option' kanban_domain %}" data-manage-url="{% url 'config-etapas-status' %}?domain={{ kanban_domain }}&amp;sector={{ item.sector_id }}"{% if can_manage %} data-can-create="1"{% endif %}{% if kind == 'condition' %} data-allow-clear="1"{% endif %}
