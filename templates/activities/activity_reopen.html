{% extends "base.html" %}
{% block title %}Reabrir atividade — LPS{% endblock %}

{% block content %}
<div class="modal-backdrop">
    <div class="modal">
        <div class="modal__head">
            <div>
                <h2>Reabrir atividade</h2>
                <div class="sub">{{ activity.title }}</div>
            </div>
            <a href="{% url 'activity-detail' activity.pk %}" class="modal__close" title="Fechar">&times;</a>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="modal__body">
                <p class="muted">A reabertura fica registrada no histórico com o motivo informado.</p>
                {% include "activities/_form_fields.html" %}
            </div>
            <div class="modal__foot">
                <a href="{% url 'activity-detail' activity.pk %}" class="btn">Voltar</a>
                <button type="submit" class="btn btn--primary">Reabrir atividade</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
