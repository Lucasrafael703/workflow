{% extends "base.html" %}
{% block title %}Reabrir atividade — LPS{% endblock %}

{% block content %}
<p class="muted"><a href="{% url 'activity-detail' activity.pk %}">← {{ activity.title }}</a></p>
<h1>Reabrir atividade</h1>
<p class="muted">A reabertura fica registrada no histórico com o motivo informado.</p>

<form method="post" class="card" style="max-width:560px">
    {% csrf_token %}
    {% include "activities/_form_fields.html" %}
    <div class="actions-row">
        <button type="submit" class="btn btn--primary">Reabrir</button>
        <a href="{% url 'activity-detail' activity.pk %}" class="btn">Voltar</a>
    </div>
</form>
{% endblock %}
