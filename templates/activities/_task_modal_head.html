{% comment %}Cabeçalho da janela de tarefa. Parâmetros: modal_title, modal_subtitle, close_url.{% endcomment %}
<header class="activity-modal-header task-modal-header">
    <span class="activity-header-icon task-header-icon" aria-hidden="true">{% include "_icon.html" with name="task" %}</span>
    <div class="activity-header-content">
        <h2 class="activity-modal-title task-modal-title">{{ modal_title }}</h2>
        <p class="activity-modal-subtitle task-modal-subtitle">{{ modal_subtitle }}</p>
    </div>
    <a href="{{ close_url }}" class="modal__close activity-modal-close" title="Fechar sem salvar" aria-label="Fechar sem salvar">&times;</a>
</header>
