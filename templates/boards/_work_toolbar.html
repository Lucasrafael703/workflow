<form class="work-toolbar" method="get" data-work-filter-form>
    <input type="hidden" name="view" value="{{ work_view.pk }}">
    <label class="work-toolbar__search">
        <span>Pesquisar</span>
        <span class="work-toolbar__search-input">{% include "_icon.html" with name="search" %}<input type="search" name="q" value="{{ request.GET.q }}" placeholder="Pesquisar {{ singular }}, cliente, obra…"></span>
    </label>
    <button class="btn btn--primary" type="submit">{% include "_icon.html" with name="search" %} Buscar</button>
    <label class="work-toolbar__control"><span>Pessoa</span><select name="pessoa"><option value="">Todas</option><option value="eu"{% if request.GET.pessoa == "eu" %} selected{% endif %}>Eu</option><option value="sem"{% if request.GET.pessoa == "sem" %} selected{% endif %}>Sem responsável</option></select></label>
    <label class="work-toolbar__control"><span>Condição</span><select name="condicao"><option value="">Todas</option>{% for item in items %}{% if item.condition %}{% ifchanged item.condition_id %}<option value="{{ item.condition_id }}"{% if request.GET.condicao == item.condition_id|stringformat:"s" %} selected{% endif %}>{{ item.condition.name }}</option>{% endifchanged %}{% endif %}{% endfor %}</select></label>
    <label class="work-toolbar__control work-toolbar__control--sector"><span>Setor</span><select name="setor"><option value="">Todos os setores</option>{% for item in items %}{% if item.sector %}{% ifchanged item.sector_id %}<option value="{{ item.sector_id }}"{% if request.GET.setor == item.sector_id|stringformat:"s" %} selected{% endif %}>{{ item.sector.name }}</option>{% endifchanged %}{% endif %}{% endfor %}</select></label>
    <details class="work-toolbar__filter"><summary>{% include "_icon.html" with name="sliders" %} Filtro</summary><div class="work-toolbar__popover"><label>Prazo<select name="prazo"><option value="">Todos</option><option value="atrasadas">Atrasadas</option><option value="hoje">Vencem hoje</option><option value="7_dias">Próximos 7 dias</option><option value="sem_prazo">Sem prazo</option></select></label><label>Etapa<select name="estagio"><option value="">Todas</option>{% for item in items %}{% if item.stage %}{% ifchanged item.stage_id %}<option value="{{ item.stage_id }}">{{ item.stage.name }}</option>{% endifchanged %}{% endif %}{% endfor %}</select></label><button class="btn btn--primary" type="submit">Aplicar</button></div></details>
    <label class="work-toolbar__control"><span>Ordenar</span><select name="ordem"><option value="prazo">Prazo</option><option value="recentes">Mais recentes</option><option value="titulo">Título</option></select></label>
    {% if can_configure and work_view.type == "KANBAN" %}<label class="work-toolbar__control"><span>Agrupar por</span><select data-work-group-by data-url="{% url 'workboard-view-settings' work_view.pk %}"><option value="stage"{% if group_by == "stage" %} selected{% endif %}>Status</option><option value="sector"{% if group_by == "sector" %} selected{% endif %}>Setor</option>{% if board.domain == "DEMAND" %}<option value="owner"{% if group_by == "owner" %} selected{% endif %}>Responsável</option><option value="urgency"{% if group_by == "urgency" %} selected{% endif %}>Prioridade</option>{% else %}<option value="responsavel"{% if group_by == "responsavel" %} selected{% endif %}>Responsável</option><option value="priority"{% if group_by == "priority" %} selected{% endif %}>Prioridade</option>{% endif %}</select></label>{% endif %}
    {% if request.GET.q or request.GET.pessoa or request.GET.condicao or request.GET.setor or request.GET.prazo or request.GET.estagio %}<a class="work-toolbar__clear" href="?view={{ work_view.pk }}">Limpar filtros</a>{% endif %}
</form>
