{% extends "base.html" %}
{% block title %}{{ title }} — LPS{% endblock %}

{% block content %}
<p class="muted"><a href="{% url 'cadastros' %}?tab={{ tab }}">← Cadastros</a></p>
<h1>{% if instance %}Editar {{ title|lower }}{% else %}Novo: {{ title|lower }}{% endif %}</h1>

<form method="post" class="card" style="max-width:520px">
    {% csrf_token %}
    {% include "activities/_form_fields.html" %}
    <div class="actions-row">
        <button type="submit" class="btn btn--primary">Salvar</button>
        <a href="{% url 'cadastros' %}?tab={{ tab }}" class="btn">Cancelar</a>
    </div>
</form>
{% endblock %}
