{% comment %}
Ícones em um sprite SVG único: carregado uma vez e referenciado por <use>.
Evita repetir marcação e mantém o traço consistente em toda a interface.
Uso: {% include "_icon.html" with name="home" %}
{% endcomment %}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-home" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-3v-5H7v5H4a1 1 0 0 1-1-1z"/>
    </g>
    <g id="i-activity" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="3" width="13" height="14" rx="2"/><path d="M7 7.5h6M7 10.5h6M7 13.5h3.5"/>
    </g>
    <g id="i-task" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="3" width="13" height="14" rx="2"/><path d="m6.8 9.8 2 2 4-4.2"/>
    </g>
    <g id="i-queue" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 5h10M7 10h10M7 15h10"/><circle cx="3.6" cy="5" r="1.1"/><circle cx="3.6" cy="10" r="1.1"/><circle cx="3.6" cy="15" r="1.1"/>
    </g>
    <g id="i-bell" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 3a4.5 4.5 0 0 0-4.5 4.5c0 3.5-1.5 4.5-1.5 4.5h12s-1.5-1-1.5-4.5A4.5 4.5 0 0 0 10 3z"/><path d="M8.6 15a1.6 1.6 0 0 0 2.8 0"/>
    </g>
    <g id="i-chart" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 16.5h13"/><path d="M6 16.5V9M10 16.5V4.5M14 16.5v-5"/>
    </g>
    <g id="i-folder" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    </g>
    <g id="i-users" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="7" r="2.6"/><path d="M3.2 16.2a4.9 4.9 0 0 1 9.6 0"/><path d="M13.4 5.2a2.4 2.4 0 0 1 0 4.6M14.6 16.2a4.4 4.4 0 0 0-1.3-3"/>
    </g>
    <g id="i-shield" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 3 4.5 5.2v4.4c0 3.3 2.3 6.3 5.5 7.4 3.2-1.1 5.5-4.1 5.5-7.4V5.2z"/><path d="m7.8 10 1.6 1.6 3-3.2"/>
    </g>
    <g id="i-settings" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="2.5"/>

    <g id="i-clock" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="7"/><path d="M10 6v4.2l2.6 1.6"/>
    </g>
    <g id="i-search" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="9" r="5.2"/><path d="m13 13 3.5 3.5"/>
    </g>
    <g id="i-plus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></g>
    <g id="i-menu" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></g>
    <g id="i-alert" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    </g>
    <g id="i-block" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="6.8"/><path d="m5.6 5.6 8.8 8.8"/></g>
    <g id="i-check" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4.6 10.4 3.6 3.6 7.2-8"/></g>
    <g id="i-info" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="7"/><path d="M10 9.2v4.2M10 6.6h.01"/>
    </g>
    <g id="i-back" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 6.5 10l5.5 5.5"/></g>
    <g id="i-inbox" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 5 4.5h10l2 7v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 11.5h3.5l1 2h5l1-2H17"/>
    </g>
  </defs>
</svg>
